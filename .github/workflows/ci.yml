name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      TALOS_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/talos_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: talos_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname talos_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Lint
        run: go vet ./...

      - name: Build
        run: go build ./cmd/server

  desktop:
    name: Desktop Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          Join-Path (go env GOPATH) "bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test native desktop
        working-directory: desktop
        run: go test ./internal/...

      - name: Vet native desktop
        working-directory: desktop
        run: go vet ./internal/...

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: desktop/frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: desktop/frontend
        run: npm run typecheck

      - name: Build desktop
        working-directory: desktop
        run: wails build
